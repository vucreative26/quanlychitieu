<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Glowing accent circle -->
  <circle cx="256" cy="256" r="140" fill="url(#primaryGrad)" opacity="0.25" filter="url(#glow)"/>

  <!-- Card / Wallet Icon Body -->
  <g transform="translate(106, 116)">
    <!-- Back card -->
    <rect x="30" y="20" width="240" height="150" rx="24" fill="#27272a" opacity="0.6"/>
    
    <!-- Front card -->
    <rect x="0" y="70" width="300" height="190" rx="28" fill="url(#primaryGrad)" filter="url(#glow)"/>
    <rect x="0" y="70" width="300" height="190" rx="28" fill="url(#primaryGrad)"/>

    <!-- Inner card details -->
    <!-- Magnetic chip -->
    <rect x="36" y="106" width="46" height="36" rx="8" fill="url(#goldGrad)"/>
    <line x1="36" y1="124" x2="82" y2="124" stroke="#b45309" stroke-width="2"/>
    <line x1="59" y1="106" x2="59" y2="142" stroke="#b45309" stroke-width="2"/>

    <!-- Card shine lines -->
    <circle cx="230" cy="190" r="32" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="12"/>
    <circle cx="250" cy="190" r="32" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="12"/>

    <!-- Balance dots -->
    <circle cx="44" cy="216" r="5" fill="#ffffff" opacity="0.8"/>
    <circle cx="62" cy="216" r="5" fill="#ffffff" opacity="0.8"/>
    <circle cx="80" cy="216" r="5" fill="#ffffff" opacity="0.8"/>
    <circle cx="98" cy="216" r="5" fill="#ffffff" opacity="0.8"/>
    <text x="120" y="222" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#ffffff">9934</text>
  </g>
</svg>
